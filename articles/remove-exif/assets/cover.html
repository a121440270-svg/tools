<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 900px; height: 383px; overflow: hidden; position: relative;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: #0b1020; color: #fff;
  }
  .glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; filter: blur(90px); }
  .g1 { right: -80px; top: -180px; background: rgba(45,212,191,.22); }
  .g2 { left: -120px; bottom: -200px; background: rgba(99,102,241,.25); }
  .grid {
    position: absolute; inset: 0; opacity: .25;
    background-image: linear-gradient(rgba(148,163,184,.18) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(148,163,184,.18) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(120% 100% at 20% 0%, #000 25%, transparent 80%);
    -webkit-mask-image: radial-gradient(120% 100% at 20% 0%, #000 25%, transparent 80%);
  }
  .left { position: absolute; left: 48px; top: 46px; width: 470px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 2px; color: #5eead4; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #2dd4bf; box-shadow: 0 0 10px #2dd4bf; }
  h1 { margin-top: 16px; font-size: 40px; line-height: 1.18; letter-spacing: -.5px; font-weight: 700; }
  h1 em { font-style: normal; color: #5eead4; }
  .sub { margin-top: 14px; font-size: 15px; color: #94a3b8; line-height: 1.5; }
  .mono {
    position: absolute; right: 44px; top: 44px; width: 320px;
    background: rgba(15,23,42,.78); border: 1px solid rgba(148,163,184,.22);
    border-radius: 14px; padding: 18px 20px; font-family: Consolas, monospace; font-size: 12.5px; line-height: 1.9;
    box-shadow: 0 20px 50px rgba(2,6,23,.5);
  }
  .k { color: #64748b; }
  .v { color: #e2e8f0; }
  .warn { color: #fb7185; }
  .ok { color: #34d399; }
  .bar { position: absolute; left: 48px; bottom: 34px; font-size: 12px; color: #64748b; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="grid"></div>

  <div class="left">
    <div class="tag"><span class="dot"></span> 照片隐私</div>
    <h1>发原图之前，<br />先看看照片里<em>藏了什么</em></h1>
    <div class="sub">GPS 坐标、设备型号、精确到秒的时间、作者与版权，还有一张你从没见过的缩略图。</div>
  </div>

  <div class="mono">
    <div><span class="k">GPSLatitude</span> <span class="warn">46.6863 N</span></div>
    <div><span class="k">GPSLongitude</span> <span class="warn">7.8632 E</span></div>
    <div><span class="k">Model</span> <span class="v">Xiaomi 14 Ultra</span></div>
    <div><span class="k">DateTime</span> <span class="v">2026-10-01 18:32</span></div>
    <div><span class="k">Artist</span> <span class="v">Lin Tao</span></div>
    <div><span class="k">Copyright</span> <span class="v">(c) 2026 Lin Tao</span></div>
    <div style="margin-top:8px"><span class="ok">35 fields found</span></div>
  </div>

  <div class="bar">onlitools.com/remove-exif</div>
</body>
</html>
