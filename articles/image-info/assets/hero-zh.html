<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 750px; overflow: hidden; position: relative;
    font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #020617;
  }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(2,6,23,0) 0%, rgba(2,6,23,.30) 45%, rgba(2,6,23,.90) 100%);
  }
  .label {
    position: absolute; top: 48px; left: 48px;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(2,6,23,.55);
    color: #67e8f9; font-size: 12px; letter-spacing: 3px; font-weight: 600;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #22d3ee; }
  .content { position: absolute; left: 64px; right: 64px; bottom: 48px; color: #fff; }
  .eyebrow { color: #a5f3fc; font-size: 15px; letter-spacing: 2px; margin-bottom: 14px; }
  h1 { font-size: 52px; line-height: 1.18; letter-spacing: -0.5px; font-weight: 700; }
  .meta { margin-top: 16px; color: #cbd5e1; font-size: 19px; }
  .chips { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    padding: 8px 16px; border-radius: 999px; font-size: 14px; color: #f8fafc;
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.24);
    backdrop-filter: blur(4px);
  }
  .brand { position: absolute; right: 48px; top: 48px; color: rgba(255,255,255,.8); font-size: 14px; letter-spacing: 1px; }
</style>
</head>
<body>
  <img class="photo" src="demo-photo-exif.jpg" alt="" />
  <div class="shade"></div>
  <div class="label"><span class="dot"></span> PHOTO / EXIF</div>
  <div class="brand">onlitools.com</div>
  <div class="content">
    <div class="eyebrow">照片里的隐形信息</div>
    <h1>这张照片，暴露了你的位置</h1>
    <div class="meta">GPS 46.6863, 7.8632 · Xiaomi 14 Ultra · 2026-10-01 18:32</div>
    <div class="chips">
      <span class="chip">拍摄地点</span>
      <span class="chip">相机型号</span>
      <span class="chip">拍摄时间</span>
      <span class="chip">作者与版权</span>
    </div>
  </div>
</body>
</html>
